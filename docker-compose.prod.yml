# Production MalafiPro sur un VPS (Contabo 8 Go). Lancement : voir deploy/INSTALLATION_VPS.md
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Seul Caddy est ouvert sur Internet (80/443). Base, Redis, API et web restent sur le réseau Docker interne.
name: malafipro

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats HTTPS (Let's Encrypt)
      - caddy_config:/config
    depends_on: [web, api]
    mem_limit: 256m

  postgres:
    # Même image qu'en local (pgvector requis par l'assistant juridique)
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mouraqib_dev}
      POSTGRES_USER: ${POSTGRES_USER:-mouraqib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    command: >
      postgres -c shared_buffers=2GB -c effective_cache_size=4GB -c work_mem=16MB
               -c maintenance_work_mem=256MB -c max_connections=100 -c timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mouraqib} -d ${POSTGRES_DB:-mouraqib_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 3g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF : les files de jobs et les verrous survivent à un redémarrage
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 400mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    restart: unless-stopped
    shm_size: 1gb             # Chromium (scraping) plante avec la mémoire partagée par défaut (64 Mo)
    env_file: deploy/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mouraqib}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mouraqib_dev}
      REDIS_URL: redis://redis:6379
      WEB_URL: https://${DOMAINE}
      TRUST_PROXY: 2          # Caddy + Next.js devant l'API
      TZ: UTC
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 3g

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Adresse INTERNE de l'API : le proxy /api de Next.js et la landing l'appellent côté serveur
        NEXT_PUBLIC_API_URL: http://api:3001
        NEXT_PUBLIC_CONTACT_TEL: ${CONTACT_COMMERCIAL_TEL:-+212607167594}
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 768m

  # Outil ponctuel (pas démarré par « up ») : insère les 73 tribunaux dans une base neuve
  #   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod run --rm seed
  seed:
    profiles: ["outils"]
    build: { context: ./apps/api, dockerfile: Dockerfile, target: builder }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mouraqib}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mouraqib_dev}
    command: ["npx", "ts-node", "prisma/seed.ts"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
